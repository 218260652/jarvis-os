name: Capture ISO boot evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/boot-check.yml']
  workflow_run:
    workflows: ['Build J.A.R.V.I.S. development ISO']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: jarvis-boot-preview
  cancel-in-progress: true
jobs:
  boot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select successful ISO build
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            let runId = context.payload.workflow_run?.id;
            if (!runId) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'build-iso.yml', status: 'success', per_page: 1
              });
              runId = response.data.workflow_runs[0]?.id;
            }
            if (!runId) throw new Error('No successful ISO build exists');
            core.setOutput('run-id', String(runId));
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: runId});
            const artifact = artifacts.data.artifacts.find(a => a.name === 'jarvis-development-iso-UNTESTED');
            if (!artifact) throw new Error('ISO artifact missing');
            core.setOutput('artifact-id', String(artifact.id));
      - name: Download ISO archive directly with retries
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact-id }}
        run: |
          mkdir -p dist
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o iso-artifact.zip
          unzip -q iso-artifact.zip -d dist
          rm iso-artifact.zip
      - name: Verify downloaded image
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 python3-pil tesseract-ocr
      - name: Capture legacy BIOS boot at 2 GB RAM
        run: /usr/bin/python3 tests/capture_boot.py dist/jarvis-os-dev-amd64.iso
      - name: Save evidence for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-boot-evidence-NEEDS-REVIEW
          path: boot-evidence/
          retention-days: 7
