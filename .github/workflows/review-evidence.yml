name: Review rendered OS evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-evidence.yml', 'tests/review_evidence.py']
  workflow_run:
    workflows: ['Capture ISO boot evidence']
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: jarvis-rendered-review
  cancel-in-progress: true
jobs:
  review:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select completed boot evidence
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            let id = context.payload.workflow_run?.id;
            if (!id) {
              const r = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'boot-check.yml', per_page: 1});
              id = r.data.workflow_runs[0]?.id;
            }
            if (!id) throw new Error('No boot evidence run exists');
            for (let n = 0; n < 60; n++) {
              const r = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: id});
              if (r.data.status === 'completed') {
                if (r.data.conclusion !== 'success') throw new Error('Boot evidence run did not succeed');
                core.setOutput('run-id', String(id));
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Boot evidence not ready');
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-boot-evidence-NEEDS-REVIEW
          path: evidence
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install rendering inspection tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y python3-pil librsvg2-bin tesseract-ocr
      - name: Compare wallpaper and inspect visible app text
        run: |
          rsvg-convert -o expected-wallpaper.png overlay/usr/share/backgrounds/jarvis/horizon.svg
          /usr/bin/python3 tests/review_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-rendered-review
          path: |
            evidence/
            rendered-review.json
          retention-days: 7
      - name: Preserve viewable screenshots on an evidence branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = ['assistant-ready.png', 'boot-120s.png', 'desktop-wallpaper.png', 'app-menu.png', 'runtime-report.png', 'chrome-launch.png', 'vlc-launch.png'];
            const entries = [];
            for (const name of files) {
              const path = 'evidence/' + name;
              if (!fs.existsSync(path)) continue;
              const blob = await github.rest.git.createBlob({owner: context.repo.owner, repo: context.repo.repo, content: fs.readFileSync(path).toString('base64'), encoding: 'base64'});
              entries.push({path: 'docs/vm-evidence/' + name, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            if (!entries.length) throw new Error('No screenshots available');
            const head = await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main'});
            const parent = await github.rest.git.getCommit({owner: context.repo.owner, repo: context.repo.repo, commit_sha: head.data.object.sha});
            const tree = await github.rest.git.createTree({owner: context.repo.owner, repo: context.repo.repo, base_tree: parent.data.tree.sha, tree: entries});
            const commit = await github.rest.git.createCommit({owner: context.repo.owner, repo: context.repo.repo, message: 'Preserve actual VM screenshot evidence from run ' + context.runId, tree: tree.data.sha, parents: [head.data.object.sha]});
            const branch = 'vm-evidence-' + context.runId + '-' + (process.env.GITHUB_RUN_ATTEMPT || '1');
            await github.rest.git.createRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'refs/heads/' + branch, sha: commit.data.sha});
            core.info('EVIDENCE_BRANCH=' + branch);
